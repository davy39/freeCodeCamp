name: Deploy - French Client to GH Pages

on:
  push:
    branches:
      - page
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build [french]
    runs-on: ubuntu-24.04

    env:
      CLIENT_LOCALE: french
      CURRICULUM_LOCALE: french
      NODE_ENV: production
      HOME_LOCATION: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      NODE_OPTIONS: "--max-old-space-size=8192"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: page
          submodules: 'recursive'
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          echo "Avant nettoyage :"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/lib/jvm
          echo "Après nettoyage :"
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Prepare Environment
        run: |
          REPO_NAME=${{ github.event.repository.name }}
          sed -i "s|exports.pathPrefix = .*|exports.pathPrefix = '/$REPO_NAME';|g" client/utils/gatsby/path-prefix.js
          echo "HOME_LOCATION=$HOME_LOCATION" > .env
          echo "API_LOCATION=https://api.freecodecamp.org" >> .env
          echo "FORUM_LOCATION=https://forum.freecodecamp.org" >> .env
          echo "NEWS_LOCATION=https://davy39.github.io/french/news" >> .env
          echo "RADIO_LOCATION=https://coderadio.freecodecamp.org" >> .env
          echo "CLIENT_LOCALE=french" >> .env
          echo "CURRICULUM_LOCALE=french" >> .env
          echo "DEPLOYMENT_ENV=production" >> .env
          echo "DEPLOYMENT_VERSION=${{ github.sha }}" >> .env
          echo "FREECODECAMP_NODE_ENV=production" >> .env
          echo "SHOW_UPCOMING_CHANGES=false" >> .env
          echo "ALGOLIA_APP_ID=algolia_dummy" >> .env
          echo "ALGOLIA_API_KEY=algolia_dummy" >> .env
          echo "STRIPE_PUBLIC_KEY=stripe_dummy" >> .env
          echo "PAYPAL_CLIENT_ID=paypal_dummy" >> .env
          echo "PATREON_CLIENT_ID=patreon_dummy" >> .env
          echo "GROWTHBOOK_URI=https://dummy.io" >> .env

      - name: Install Dependencies
        run: pnpm install

      - name: Compile TypeScript
        run: pnpm run compile:ts

      - name: Build Curriculum
        run: pnpm run build:curriculum

      - name: Build Client
        run: pnpm run build:client

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client/public'

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
